<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Hash symbol</title>
  <desc id="desc">A white hash symbol on a rounded Visual Studio-inspired purple and blue gradient.</desc>

  <defs>
    <linearGradient id="background" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B4DFF"/>
      <stop offset="0.48" stop-color="#68217A"/>
      <stop offset="1" stop-color="#007ACC"/>
    </linearGradient>
    <radialGradient id="highlight" cx="0" cy="0" r="1" gradientTransform="translate(132 92) rotate(42) scale(390 310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#261044" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#background)"/>
  <rect width="512" height="512" rx="104" fill="url(#highlight)"/>

  <g fill="#FFFFFF" filter="url(#symbolShadow)">
    <rect x="169" y="105" width="48" height="302" rx="24" transform="rotate(7 193 256)"/>
    <rect x="295" y="105" width="48" height="302" rx="24" transform="rotate(7 319 256)"/>
    <rect x="104" y="187" width="304" height="48" rx="24"/>
    <rect x="104" y="277" width="304" height="48" rx="24"/>
  </g>
</svg>
