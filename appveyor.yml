image: Visual Studio 2026

version: 0.1.{build}

# Publication credentials; configure these as secure project environment
# variables when the corresponding publisher is enabled:
# - VSIX_GALLERY_MANAGE_TOKEN for the Open VSIX Gallery
# - NUGET_API_KEY for NuGet.org

build: off
test: off

init:
  - git config --global core.autocrlf true

build_script:
  - appveyor-build.cmd
